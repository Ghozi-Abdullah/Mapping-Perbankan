name: Tarik data Bank Indonesia

on:
  schedule:
    # Senin dan Kamis 07.17 WIB. BI menerbitkan SEKI bulanan; tanggal rilisnya tidak tetap.
    - cron: "17 0 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarik-data
  cancel-in-progress: false

jobs:
  tarik:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang pembaca Excel
        run: pip install xlrd==2.0.1 openpyxl==3.1.5

      - name: Uji penarik data
        run: python3 -m unittest -q test_fetch test_ojk

      - name: Tarik tabel SEKI
        run: python3 fetch.py

      - name: Tarik daftar resmi bank umum dari OJK
        # Tetap jalan walau SEKI gagal; kegagalan dicatat di data/ojk-bank.json tanpa menghapus daftar lama.
        if: always()
        run: python3 ojk.py

      - name: Simpan data
        # Tetap disimpan walau penarikan gagal, supaya data/status.json dan data/diagnosa.json bisa diperiksa.
        if: always()
        run: |
          [ -d data ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Data SEKI $(TZ=Asia/Jakarta date +'%d-%m-%Y %H.%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
